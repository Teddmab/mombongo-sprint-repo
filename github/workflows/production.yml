name: Deploy — Production

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  FIREBASE_PROJECT: mombongo-prod
  PRODUCTION_URL: https://app.mombongo.coop

jobs:
  approval-gate:
    name: Manual Approval
    runs-on: ubuntu-latest
    environment: production
    # GitHub → Settings → Environments → production
    # Add Patrick + Afrotouch OU as required reviewers
    steps:
      - run: echo "Production deploy approved."

  ci:
    name: Full CI
    runs-on: ubuntu-latest
    needs: approval-gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Cache Firebase Emulator
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-v1
      - run: bun install
      - run: bun run lint && bun run typecheck && bun run test:unit
      - run: bun install -g firebase-tools
      - name: Start emulator
        run: |
          firebase emulators:start --only auth,firestore,storage \
            --project mombongo-dev --import ./emulator-seed &
          npx wait-on http://localhost:4000 --timeout 60000
      - run: bun run test:integration
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8080
          FIREBASE_AUTH_EMULATOR_HOST: localhost:9099

  build:
    name: Build (Production)
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.PROD_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.PROD_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: mombongo-prod
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.PROD_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.PROD_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.PROD_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.PROD_FIREBASE_VAPID_KEY }}
          VITE_ENVIRONMENT: production
          VITE_CINETPAY_MODE: live
      - uses: actions/upload-artifact@v4
        with:
          name: dist-production
          path: dist/

  deploy-firebase:
    name: Deploy Firebase (mombongo-prod)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install -g firebase-tools
      - run: |
          firebase deploy \
            --only firestore:rules,firestore:indexes,storage:rules \
            --project ${{ env.FIREBASE_PROJECT }} \
            --token ${{ secrets.FIREBASE_TOKEN_PROD }}

  deploy-vercel:
    name: Deploy → Vercel Production
    runs-on: ubuntu-latest
    needs: [build, deploy-firebase]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: dist-production, path: dist/ }
      - uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: dist/
          vercel-args: '--prod'
          alias-domains: app.mombongo.coop

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy-vercel
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:smoke
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.PRODUCTION_URL }}

  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: smoke-tests
    steps:
      - name: Check production URL
        run: |
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" ${{ env.PRODUCTION_URL }})
          if [ "$STATUS" != "200" ]; then echo "❌ HTTP $STATUS" && exit 1; fi
          echo "✅ Production healthy: HTTP $STATUS"

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: health-check
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Get version
        id: ver
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
      - uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.ver.outputs.VERSION }}-${{ github.run_number }}
          release_name: v${{ steps.ver.outputs.VERSION }}
          body: |
            **Deployed:** ${{ env.PRODUCTION_URL }}
            **Commit:** ${{ github.sha }}
          draft: false
          prerelease: false

  notify:
    name: Notify Stakeholders
    runs-on: ubuntu-latest
    needs: health-check
    if: always()
    steps:
      - name: Notify success
        if: needs.health-check.result == 'success'
        run: |
          curl -X POST "${{ secrets.WHATSAPP_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"message":"🚀 *Production deploy OK*\nURL: ${{ env.PRODUCTION_URL }}\nAll smoke tests passed.","group":"team"}'
      - name: Notify failure
        if: needs.health-check.result != 'success'
        run: |
          curl -X POST "${{ secrets.WHATSAPP_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"message":"🔴 *Production deploy FAILED*\nImmediate attention needed.\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}","group":"team"}'
