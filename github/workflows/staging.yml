name: Deploy — Staging

on:
  push:
    branches: [staging]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '17'
  FIREBASE_PROJECT: mombongo-dev
  STAGING_URL: https://staging.mombongo.coop

jobs:
  ci:
    name: Full CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '${{ env.JAVA_VERSION }}' }
      - name: Cache Firebase Emulator
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-v1
      - run: bun install
      - run: bun run lint && bun run typecheck
      - run: bun run test:unit
      - run: bun install -g firebase-tools
      - name: Start emulator
        run: |
          firebase emulators:start --only auth,firestore,storage \
            --project ${{ env.FIREBASE_PROJECT }} --import ./emulator-seed &
          npx wait-on http://localhost:4000 --timeout 60000
      - run: bun run test:integration
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8080
          FIREBASE_AUTH_EMULATOR_HOST: localhost:9099

  build:
    name: Build (Staging)
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.STAGING_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.STAGING_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: mombongo-dev
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.STAGING_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.STAGING_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.STAGING_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.STAGING_FIREBASE_VAPID_KEY }}
          VITE_ENVIRONMENT: staging
          VITE_CINETPAY_MODE: sandbox
      - uses: actions/upload-artifact@v4
        with:
          name: dist-staging
          path: dist/

  deploy-vercel:
    name: Deploy → Vercel Staging
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: dist-staging, path: dist/ }
      - uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: dist/
          alias-domains: staging.mombongo.coop

  deploy-firebase:
    name: Deploy Firebase Rules + Functions
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install -g firebase-tools
      - run: firebase deploy --only firestore:rules,firestore:indexes,storage:rules
          --project ${{ env.FIREBASE_PROJECT }} --token ${{ secrets.FIREBASE_TOKEN }}

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: deploy-vercel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.STAGING_URL }}
          TEST_INVESTOR_EMAIL: ${{ secrets.TEST_INVESTOR_EMAIL }}
          TEST_INVESTOR_PASSWORD: ${{ secrets.TEST_INVESTOR_PASSWORD }}
          TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-staging
          path: playwright-report/
          retention-days: 7

  notify:
    name: Notify Team
    runs-on: ubuntu-latest
    needs: e2e
    if: always()
    steps:
      - name: Notify success
        if: needs.e2e.result == 'success'
        run: |
          curl -X POST "${{ secrets.WHATSAPP_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"message":"✅ *Staging deploy OK*\nURL: ${{ env.STAGING_URL }}\nJuve — please QA on Android device.","group":"team"}'
      - name: Notify failure
        if: needs.e2e.result != 'success'
        run: |
          curl -X POST "${{ secrets.WHATSAPP_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"message":"❌ *Staging deploy FAILED*\nCheck GitHub Actions.","group":"team"}'
