openapi: 3.1.0
info:
  title: Mombongo Partner API
  version: 1.5.0
  description: |
    API surface for external partners integrating with Mombongo's payment
    and marketplace rails. AROM is the first (and currently only) partner.

    ## Two invoice origins

    - **Partner-originated** (Sprint AI, live since 2026-08): your system
      creates an invoice via `createExternalInvoice`, then a Mombongo user
      pays it via `createExternalInvoiceCheckout`. This is what you already
      integrated.
    - **Harvest-sale, partner-sourced** (Sprint DP, new): a farmer publishes
      a harvest listing on Mombongo; you discover it via
      `getExternalPublishedListings` and submit an offer via
      `createExternalHarvestOffer`. If the farmer picks your offer, Mombongo
      creates the invoice itself and sends you the new `invoiceIssued`
      webhook. You then pay it the exact same way — `createExternalInvoiceCheckout`
      is unmodified and works identically regardless of which flow created
      the invoice.

    ## Environment

    There is a single Firebase project (`mombongo-dev`) — no separate
    staging/production project. Every `partners` and `external_invoices`
    document carries a `testMode` boolean; a new invoice inherits your
    partner account's `testMode` setting, so your sandbox and live traffic
    are distinguished by that flag, not by a different base URL or set of
    credentials.

    ## Authenticating inbound requests (you → Mombongo)

    Every endpoint below requires two headers:

    - `x-partner-id` — your partner id (e.g. `arom`).
    - `x-partner-signature` — lowercase hex HMAC-SHA256 of the **raw request
      body bytes**, using the `hmacSecret` we gave you when provisioning
      your account. Sign the bytes exactly as sent — not a re-serialized or
      re-ordered version of the JSON, since that can produce a different
      byte sequence than what we verify against.

      ```
      signature = hex(HMAC_SHA256(hmacSecret, rawRequestBodyBytes))
      ```

    A missing header, an inactive partner account, or a signature mismatch
    all fail the same way: `401 Invalid signature`. There is no partial
    credit or descriptive error here by design — we don't want to help an
    attacker narrow down which part of a forged request is wrong.

    ## Authenticating outbound webhooks (Mombongo → you)

    Both webhooks below are signed the same way, but with a **different**
    secret (`outboundHmacSecret`, not `hmacSecret`) and over the
    **JSON-serialized payload** (not raw bytes, since we're the ones
    constructing the request):

    ```
    x-mombongo-signature = hex(HMAC_SHA256(outboundHmacSecret, JSON.stringify(payload)))
    ```

    Verify this before trusting the payload. If your endpoint doesn't
    return a 2xx response, we retry up to 3 times with exponential backoff
    (2s, 4s), then give up — the event is logged on our side as a dead
    letter, visible to us in our own admin console with a manual-retry
    button, so if you were down when we tried, tell us and we can resend it
    by hand rather than you needing to reconcile from a polling loop.

    Both outbound webhooks land on the same `webhookUrl` — every payload
    carries an `event` field (`"payment_complete"` or `"invoice_issued"`)
    so your receiver can route without guessing from which other fields
    happen to be present.

    ## Worked example — signing a request

    A full, verifiable example for `createExternalHarvestOffer`, so you
    can check your own implementation produces the exact same signature
    for the exact same input before pointing it at a real secret.

    Given `hmacSecret = "test_hmac_secret_do_not_use_in_production"` and
    this exact raw request body (note: no extra whitespace — sign the
    bytes you actually send, not a pretty-printed version):

    ```
    {"listingId":"listing_abc123","offerQuantityKg":500,"offerPricePerKgCdf":450}
    ```

    ```bash
    echo -n '{"listingId":"listing_abc123","offerQuantityKg":500,"offerPricePerKgCdf":450}' \
      | openssl dgst -sha256 -hmac "test_hmac_secret_do_not_use_in_production"
    ```

    produces:

    ```
    02abf6e9259aec73dcb388cc9e3d35d10075a5f9ca47d6351efa9d1f810f6c60
    ```

    So the full request is:

    ```bash
    curl -X POST https://europe-west1-mombongo-dev.cloudfunctions.net/createExternalHarvestOffer \
      -H "content-type: application/json" \
      -H "x-partner-id: arom" \
      -H "x-partner-signature: 02abf6e9259aec73dcb388cc9e3d35d10075a5f9ca47d6351efa9d1f810f6c60" \
      -d '{"listingId":"listing_abc123","offerQuantityKg":500,"offerPricePerKgCdf":450}'
    ```

    If your computed signature doesn't match ours for this exact input,
    the mismatch is almost always in how the body gets serialized before
    signing — a JSON library that reorders keys, adds whitespace, or
    changes number formatting will produce a different byte sequence and
    therefore a different signature, even though the parsed JSON is
    "the same." Sign the literal bytes you're about to send on the wire.

    ## Idempotency

    `createExternalInvoice` is idempotent on `externalInvoiceId` — calling
    it twice with the same id returns `{ "status": "duplicate_ignored" }`
    and the original invoice, rather than creating a second one.

    `createExternalHarvestOffer` **requires** an `Idempotency-Key` header
    as of contract v2 (2026-09) — v1 had no duplicate-submission
    protection at all: two identical requests created two independent
    offers, and a request that timed out after Mombongo committed could
    never be reconciled without risking a second offer. Identity is
    scoped by `(your partner id, key)`, so two partners can never collide
    on the same key value. A canonical request fingerprint (`listingId` +
    `offerQuantityKg` + `offerPricePerKgCdf` + normalized `message` +
    `externalReference`) distinguishes a legitimate replay from a key
    reused for a genuinely different request:

    - same key + same fingerprint → returns the original result again,
      `replayed: true`
    - same key + different fingerprint → `409`
    - invalid request → `400`, before either the key or an offer is
      written — safe to retry with the same key once fixed
    - two truly simultaneous identical submissions → exactly one offer is
      ever created

    A request with no `Idempotency-Key` header is rejected with `400` —
    there is no legacy no-header path anymore. Send a client-generated
    unique value (a UUID is fine) per logical submission; reuse the same
    value only when retrying the exact same submission.

    ## Error responses

    Most error responses are a plain-text body with a plain HTTP status
    code, **not** a JSON envelope — this mirrors this codebase's existing
    webhook conventions rather than introducing a new one just for this
    API. A few success/conflict responses that carry data are JSON (called
    out per-endpoint below). Don't assume every non-2xx body is parseable
    JSON.

    ## Changelog

    - **1.5.0** (2026-09) — `createExternalHarvestOffer` now requires an
      `Idempotency-Key` header (breaking — a request without one is
      rejected with `400`); response shape changed from
      `{status, offerId}` to `{submissionStatus, offerId,
      externalReference, replayed}`. New `offer_status_changed` webhook.
      `invoiceIssued` bumped to schemaVersion 2 (additive — adds eventId/
      offerId/externalReference/unitPriceCdf/totalAmountCdf/currency,
      every v1 field unchanged). New `externalReference` request field on
      `createExternalHarvestOffer`.
    - **1.4.0** — `getExternalHarvestOffer`/`getExternalHarvestOffers`
      (reconciliation/read API); accepted offers carry `seller`/`listing`
      enrichment.
    - **1.3.0** — `card` removed as a payment method.
    - **1.2.0** — Sprint DP: `getExternalPublishedListings`,
      `createExternalHarvestOffer`, `invoiceIssued` v1.

servers:
  - url: https://europe-west1-mombongo-dev.cloudfunctions.net
    description: >-
      Single environment. Each endpoint below is its own Cloud Function at
      this base URL (e.g. .../createExternalInvoice) — there is no shared
      /v1 or /api path prefix.

security:
  - PartnerId: []
    PartnerSignature: []

components:
  securitySchemes:
    PartnerId:
      type: apiKey
      in: header
      name: x-partner-id
      description: Your partner id, e.g. "arom".
    PartnerSignature:
      type: apiKey
      in: header
      name: x-partner-signature
      description: >-
        Lowercase hex HMAC-SHA256 of the raw request body bytes, signed
        with your hmacSecret. See the top-level description for the exact
        algorithm.

  schemas:
    Currency:
      type: string
      enum: [USD]
      description: >-
        Only USD is meaningful today — the amountUsd field name is not
        decorative, but the currency field itself is not currently
        validated server-side against it. Always send "USD".

    PaymentMethod:
      type: string
      enum: [mobile_money, bank_transfer]
      description: >-
        card was removed platform-wide (never processed a real payment) —
        mobile_money is the only implemented method today. bank_transfer
        is accepted as a value but not yet implemented — calling
        createExternalInvoiceCheckout with method "bank_transfer" returns
        501. No provider has been chosen for it yet.

    MobileMoneyOperator:
      type: string
      enum: [mpesa, airtel, orange]
      description: DRC mobile money correspondents, routed through PawaPay.

    InvoiceStatus:
      type: string
      enum: [pending, checkout_created, paid, failed]

    CreateExternalInvoiceRequest:
      type: object
      required: [externalInvoiceId, amountUsd, currency]
      properties:
        externalInvoiceId:
          type: string
          description: Your own invoice id. Used as the idempotency key.
        amountUsd:
          type: number
          exclusiveMinimum: 0
        currency:
          $ref: '#/components/schemas/Currency'
        dueDate:
          type: [string, 'null']
          format: date-time
        reference:
          type: [string, 'null']
          description: Free-text reference shown in Mombongo's admin console.

    CreateExternalInvoiceResponse:
      type: object
      properties:
        status:
          type: string
          enum: [accepted, duplicate_ignored]
        invoiceId:
          type: string
          description: >-
            Mombongo's own external_invoices document id — this is what you
            pass as invoiceId to every other endpoint below. It is not the
            same value as externalInvoiceId.

    CreateExternalInvoiceCheckoutRequest:
      type: object
      required: [invoiceId, method]
      properties:
        invoiceId:
          type: string
          description: Mombongo's invoiceId, from CreateExternalInvoiceResponse.
        method:
          $ref: '#/components/schemas/PaymentMethod'
        phone:
          type: string
          description: Required when method is mobile_money. E.164-ish DRC format.
        operator:
          $ref: '#/components/schemas/MobileMoneyOperator'

    CreateExternalInvoiceCheckoutResponse:
      type: object
      required: [status, providerRef, depositStatus]
      properties:
        status:
          type: string
          enum: [checkout_created]
        providerRef:
          type: string
          description: PawaPay depositId.
        depositStatus:
          type: string
          description: >-
            PawaPay's initial acceptance status (e.g. "ACCEPTED") — this
            is not the final payment outcome, which arrives later via the
            paymentComplete webhook.

    PublishedListing:
      type: object
      description: >-
        An explicit, curated response shape (v1.3.0) — not a raw dump of
        Mombongo's internal listing record. Fields not listed here (e.g.
        sellerRole, createdAt/updatedAt) are never sent.
      properties:
        id:
          type: string
        commodity:
          type: string
        province:
          type: string
        territory:
          type: [string, 'null']
        quantityKg:
          type: number
        quality:
          type: [string, 'null']
          enum: [A, B, C, null]
        pricePerKgCdf:
          type: number
        sellerId:
          type: string
          description: The farmer's Mombongo user id.
        sellerName:
          type: [string, 'null']
          description: >-
            The farmer's display name where Mombongo has one on file,
            otherwise a generic placeholder ("Vendeur") — never assume this
            uniquely or reliably identifies the farmer.
        photoUrls:
          type: array
          items:
            type: string
            format: uri
          description: >-
            Signed, time-limited read URLs (valid 7 days from when the
            photo was uploaded, not from when you fetch this listing) — do
            not cache these long-term. Empty when the farmer hasn't
            uploaded a photo, which is common.
        description:
          type: string
        availableFrom:
          type: [string, 'null']
          format: date-time
        availableUntil:
          type: [string, 'null']
          format: date-time
        status:
          type: string
          enum: [active]
          description: Only active listings are ever returned by this endpoint.

    GetExternalPublishedListingsRequest:
      type: object
      properties:
        commodity:
          type: string
          description: Optional exact-match filter.
        province:
          type: string
          description: Optional exact-match filter.
        limit:
          type: integer
          default: 20

    GetExternalPublishedListingsResponse:
      type: object
      properties:
        listings:
          type: array
          items:
            $ref: '#/components/schemas/PublishedListing'

    CreateExternalHarvestOfferRequest:
      type: object
      required: [listingId, offerQuantityKg, offerPricePerKgCdf]
      properties:
        listingId:
          type: string
          description: id from a PublishedListing.
        offerQuantityKg:
          type: number
          exclusiveMinimum: 0
          description: Must not exceed the listing's own quantityKg.
        offerPricePerKgCdf:
          type: number
          exclusiveMinimum: 0
        message:
          type: [string, 'null']
          description: Optional note shown to the farmer.
        externalReference:
          type: [string, 'null']
          description: >-
            Your own reference for this offer, echoed back on every
            response and webhook that concerns it (this response,
            getExternalHarvestOffer(s), offer_status_changed, and
            invoiceIssued). Part of the idempotency fingerprint — changing
            it changes the fingerprint even if every other field is
            identical. Optional, but recommended if you need to look up an
            offer by your own id rather than Mombongo's offerId.

    CreateExternalHarvestOfferResponse:
      type: object
      description: >-
        Contract v2 — an HTTP-level acknowledgement only. submissionStatus
        never signals business acceptance; that's exclusively communicated
        by the offer_status_changed webhook, or by polling
        getExternalHarvestOffer.
      required: [submissionStatus, offerId, replayed]
      properties:
        submissionStatus:
          type: string
          enum: [submitted]
          description: >-
            Always "submitted" on a 200 — this field only ever means "we
            received and processed this HTTP request", replacing v1's
            ambiguous `status: "accepted"`.
        offerId:
          type: string
        externalReference:
          type: [string, 'null']
          description: Echoes your own externalReference from the request, if you sent one.
        replayed:
          type: boolean
          description: >-
            true if this (Idempotency-Key, fingerprint) pair was already
            processed and you're seeing the original result again, rather
            than a newly created offer.

    ExternalHarvestOfferStatus:
      type: string
      enum: [pending, accepted, declined]
      description: >-
        `pending` becomes `accepted` or `declined` exactly once and never
        changes again. The offered quantity and price are never amended —
        `accepted` means the farmer accepted your offer as submitted.

    ExternalOfferSeller:
      type: object
      description: >-
        Who is selling. Present only on `accepted` offers; `null` on
        `pending` and `declined` offers.
      required: [id, displayName]
      properties:
        id:
          type: string
          description: >-
            The farmer's stable Mombongo user id, snapshotted on the offer
            when you submitted it — the same value as `sellerId` on the
            listing you offered against and as `farmerId` on the
            `invoiceIssued` webhook. Safe to use as a key.
        displayName:
          type: [string, 'null']
          description: >-
            A display name only — trimmed, at most 80 characters. `null`
            when Mombongo has no usable name: the listing carries only a
            generic placeholder ("Vendeur", "Agriculteur"), the value is
            empty, or it looks like an email address or phone number. Never
            fabricated. It is a label for a person to read, **not** a
            verified identity — do not use it to match or authenticate a
            farmer; use `id`.

    ExternalOfferThumbnail:
      type: object
      required: [url, expiresAt]
      properties:
        url:
          type: string
          format: uri
          description: >-
            A read URL generated fresh on every call to this endpoint, valid
            for about one hour. It is not the (possibly long-expired) URL the
            listing was originally published with.
        expiresAt:
          type: string
          format: date-time
          description: >-
            Exactly when `url` stops working. Do not persist `url` beyond
            this time — call the endpoint again to get a new one.

    ExternalOfferListing:
      type: object
      description: >-
        The listing the offer was made on, as it stands now. Present only on
        `accepted` offers; `null` on `pending` and `declined` offers, and
        `null` on an accepted offer whose listing no longer exists (or
        cannot be verified to belong to that offer's farmer). Once an offer
        is accepted the listing is `sold` and no longer appears in
        `getExternalPublishedListings`, so this is where you can still
        retrieve it.
      required: [commodity, commodityCode, province, territory, thumbnail]
      properties:
        commodity:
          type: [string, 'null']
          description: Human-readable product name as the farmer published it (e.g. "Ananas").
        commodityCode:
          type: [string, 'null']
          description: >-
            Mombongo's canonical commodity code (e.g. `ananas`) when one is
            stored on the listing, otherwise `null`. Never derived from
            `commodity` — a `null` here does not mean the product is
            unknown, only that no code was recorded.
        province:
          type: [string, 'null']
        territory:
          type: [string, 'null']
          description: "`null` when the farmer left it blank."
        thumbnail:
          oneOf:
            - $ref: '#/components/schemas/ExternalOfferThumbnail'
            - type: 'null'
          description: >-
            The listing's first usable photo, or `null` — the listing has no
            photo (common), the stored photo could not be safely resolved,
            or signing a fresh URL failed. **Treat the image as optional
            presentation context**: your UI must render correctly with no
            thumbnail, and must handle the image failing to load. Mombongo
            does not verify the file still exists before issuing the URL.

    ExternalHarvestOffer:
      type: object
      description: >-
        An offer you submitted, as Mombongo currently holds it. The first
        ten fields are the reconciliation contract and are unchanged since
        v1.3; `seller` and `listing` were added in v1.4.0 and are purely
        additive (clients that ignore unknown fields are unaffected).


        **This is not proof of delivery.** `status: accepted` and an
        `invoiceId` mean the farmer accepted your offer and Mombongo issued
        the invoice — nothing here says the goods have arrived or been
        inspected. **Mombongo does not track physical reception** of
        harvest-sale goods; that state belongs entirely to your own system,
        and no field or event from us will tell you it happened.
      required:
        [offerId, externalReference, listingId, status, quantityKg, unitPriceCdf, currency, createdAt, updatedAt, invoiceId, seller, listing]
      properties:
        offerId:
          type: string
        externalReference:
          type: [string, 'null']
          description: Your own reference, if you supplied one when submitting.
        listingId:
          type: string
        status:
          $ref: '#/components/schemas/ExternalHarvestOfferStatus'
        quantityKg:
          type: number
          description: The quantity you offered — also the quantity invoiced if accepted.
        unitPriceCdf:
          type: number
          description: The price per kg you offered — also the price invoiced if accepted.
        currency:
          type: string
          enum: [CDF]
        createdAt:
          type: [string, 'null']
          format: date-time
        updatedAt:
          type: [string, 'null']
          format: date-time
          description: >-
            The authoritative time of the last change to this offer (its
            creation, or its acceptance/decline). Use it to decide whether
            your cached copy is stale.
        invoiceId:
          type: [string, 'null']
          description: Set once the offer is accepted and the invoice issued; otherwise `null`.
        seller:
          oneOf:
            - $ref: '#/components/schemas/ExternalOfferSeller'
            - type: 'null'
        listing:
          oneOf:
            - $ref: '#/components/schemas/ExternalOfferListing'
            - type: 'null'

    GetExternalHarvestOfferRequest:
      type: object
      description: Provide exactly one of `offerId` or `externalReference`.
      properties:
        offerId:
          type: string
        externalReference:
          type: string

    GetExternalHarvestOffersRequest:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ExternalHarvestOfferStatus'
        updatedSince:
          type: string
          format: date-time
          description: Only offers changed strictly after this time.
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        cursor:
          type: string
          description: The `nextCursor` from the previous page.

    GetExternalHarvestOffersResponse:
      type: object
      required: [offers, nextCursor]
      properties:
        offers:
          type: array
          description: Oldest-changed first (by `updatedAt`), so you can page forward in time from a cursor.
          items:
            $ref: '#/components/schemas/ExternalHarvestOffer'
        nextCursor:
          type: [string, 'null']
          description: Pass back as `cursor` for the next page; `null` when there is no further page.

    ErrorPlainText:
      type: string
      description: A human-readable error message, sent as text/plain, not JSON.

  responses:
    InvalidSignature:
      description: Missing/invalid x-partner-id or x-partner-signature, or an inactive partner account.
      content:
        text/plain:
          schema:
            $ref: '#/components/schemas/ErrorPlainText'
            example: Invalid signature
    MissingFields:
      description: Required fields missing or invalid.
      content:
        text/plain:
          schema:
            $ref: '#/components/schemas/ErrorPlainText'

paths:
  /createExternalInvoice:
    post:
      operationId: createExternalInvoice
      summary: Create an invoice for a Mombongo user to pay (partner-originated flow)
      description: >-
        Use this when your own system originates the invoice — the flow you
        already integrated. Not used for the harvest-sale flow, where
        Mombongo creates the invoice itself and tells you via the
        invoiceIssued webhook instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExternalInvoiceRequest'
      responses:
        '200':
          description: Accepted (or a duplicate of an already-accepted externalInvoiceId).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateExternalInvoiceResponse'
        '400':
          $ref: '#/components/responses/MissingFields'
        '401':
          $ref: '#/components/responses/InvalidSignature'
        '405':
          description: Method not allowed — this endpoint only accepts POST.

  /createExternalInvoiceCheckout:
    post:
      operationId: createExternalInvoiceCheckout
      summary: Create a mobile-money payment session for a pending invoice
      description: >-
        Works identically regardless of whether the invoice came from
        createExternalInvoice or from the harvest-sale flow (the
        invoiceIssued webhook) — this endpoint and everything downstream of
        it is unmodified by Sprint DP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExternalInvoiceCheckoutRequest'
      responses:
        '200':
          description: Checkout session created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateExternalInvoiceCheckoutResponse'
        '400':
          description: Missing required fields, or phone/operator missing for mobile_money.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ErrorPlainText'
        '401':
          $ref: '#/components/responses/InvalidSignature'
        '404':
          description: Invoice not found, or it does not belong to your partner id.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ErrorPlainText'
        '409':
          description: A checkout already exists for this invoice, or it's already resolved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [already_in_progress]
                  currentStatus:
                    $ref: '#/components/schemas/InvoiceStatus'
        '500':
          description: Your partner account has no linked merchant account — contact us.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ErrorPlainText'
        '501':
          description: method was bank_transfer — not implemented yet.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ErrorPlainText'
        '502':
          description: The PawaPay call itself failed.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ErrorPlainText'

  /getExternalPublishedListings:
    post:
      operationId: getExternalPublishedListings
      summary: Browse currently-published harvest listings (New — Sprint DP)
      description: >-
        Read-only. GET-shaped but implemented as POST so the request body
        can be signed the same way as every other endpoint here — a GET has
        no body to sign.


        Your account may be scoped to a subset of commodities (set on our
        side at onboarding, e.g. pineapple only) — the `commodity` filter
        below can only narrow within that scope, never outside it. If
        you're not seeing a product you expect, this is the first thing to
        check with us before assuming it's a bug.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetExternalPublishedListingsRequest'
      responses:
        '200':
          description: Listings matching the given filters, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetExternalPublishedListingsResponse'
        '401':
          $ref: '#/components/responses/InvalidSignature'
        '405':
          description: Method not allowed — this endpoint only accepts POST.

  /createExternalHarvestOffer:
    post:
      operationId: createExternalHarvestOffer
      summary: Submit an offer on a published listing (contract v2 — Idempotency-Key required)
      description: >-
        Validation (quantity within the listing's remaining amount, price >
        0, listing still active) is identical to the in-app merchant path —
        both call the same shared validation logic. If the farmer later
        selects your offer, you'll receive both the offer_status_changed
        and invoiceIssued webhooks below (offer_status_changed first —
        "accepted", fired right after the transaction commits — then
        invoiceIssued); if they pick someone else's, you only receive
        offer_status_changed with status "declined". You can also read the
        current state of any of your offers with `getExternalHarvestOffer` /
        `getExternalHarvestOffers` below at any time, independent of
        webhook delivery.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 200
          description: >-
            Required as of contract v2 — see the Idempotency section above.
            1-200 characters, must not contain `/`. A request with this
            header missing or empty is rejected with `400` before any
            offer is created.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExternalHarvestOfferRequest'
      responses:
        '200':
          description: >-
            Request received and processed — this is an HTTP-level
            acknowledgement only, never a business-acceptance signal. A
            `replayed: true` response means this exact (key, fingerprint)
            pair was already processed and you're seeing the original
            result again, not a new offer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateExternalHarvestOfferResponse'
        '400':
          description: >-
            Missing required fields, a missing/malformed Idempotency-Key
            header, or the shared validation rejected the offer (listing
            not active, quantity exceeds what's available, price <= 0).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ErrorPlainText'
        '401':
          $ref: '#/components/responses/InvalidSignature'
        '409':
          description: >-
            This Idempotency-Key was already used for a request with a
            different fingerprint (listingId/quantity/price/message/
            externalReference) — not a safe retry. Use a new key for a
            genuinely different submission.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ErrorPlainText'
        '500':
          description: Your partner account has no linked merchant account — contact us.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ErrorPlainText'

  /getExternalHarvestOffer:
    post:
      operationId: getExternalHarvestOffer
      summary: Look up one of your offers (v1.4.0 adds seller/listing on accepted offers)
      description: >-
        Returns the current state of a single offer you submitted, found by
        `offerId` or by your own `externalReference` (exactly one of the
        two). An offer that belongs to another partner is indistinguishable
        from one that does not exist: both return 404.


        **Accepted offers carry `seller` and `listing`.** They exist so you
        can show a person which delivery this offer refers to — who is
        selling, what product, where from, and a photo — after the listing
        has left the active feed. `pending` and `declined` offers return
        `seller: null` and `listing: null`.


        - `listing.thumbnail.url` is issued fresh on every call and expires
          at `listing.thumbnail.expiresAt` (about one hour). Do not store the
          URL; store nothing but what you need and call again for a new one.
        - Enrichment is best-effort and never causes an error: if the
          listing is gone or the image cannot be signed you still receive
          `200` with the offer, and `seller.displayName` / `listing` /
          `listing.thumbnail` set to `null` as described on their schemas.
        - The image is optional presentation context. Your app must work
          when it is `null` or fails to load.
        - **This is not proof of delivery.** Mombongo does not track
          physical reception; you own that state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetExternalHarvestOfferRequest'
      responses:
        '200':
          description: The offer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalHarvestOffer'
              examples:
                accepted:
                  summary: An accepted offer
                  value:
                    offerId: offer_9f2c
                    externalReference: arom-po-1042
                    listingId: listing_abc123
                    status: accepted
                    quantityKg: 500
                    unitPriceCdf: 450
                    currency: CDF
                    createdAt: '2026-09-18T08:12:44.120Z'
                    updatedAt: '2026-09-19T14:03:10.871Z'
                    invoiceId: inv_71d0
                    seller:
                      id: 3fXk2Qe1LdN0sYw9
                      displayName: Jean Mbala
                    listing:
                      commodity: Ananas
                      commodityCode: ananas
                      province: Kongo Central
                      territory: Mbanza-Ngungu
                      thumbnail:
                        url: https://storage.googleapis.com/example-bucket/listings/3fXk2Qe1LdN0sYw9/listing_abc123/1700000000000-photo.jpg?X-Goog-Expires=3600&X-Goog-Signature=0a1b2c
                        expiresAt: '2026-09-20T11:00:00.000Z'
                pending:
                  summary: A pending (or declined) offer
                  value:
                    offerId: offer_a41b
                    externalReference: null
                    listingId: listing_abc123
                    status: pending
                    quantityKg: 200
                    unitPriceCdf: 430
                    currency: CDF
                    createdAt: '2026-09-18T09:00:00.000Z'
                    updatedAt: '2026-09-18T09:00:00.000Z'
                    invoiceId: null
                    seller: null
                    listing: null
        '400':
          description: Neither or both of `offerId` and `externalReference` were supplied.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ErrorPlainText'
        '401':
          $ref: '#/components/responses/InvalidSignature'
        '404':
          description: No such offer for your partner account.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ErrorPlainText'
        '405':
          description: Method not allowed — this endpoint only accepts POST.

  /getExternalHarvestOffers:
    post:
      operationId: getExternalHarvestOffers
      summary: List your offers (v1.4.0 adds seller/listing on accepted offers)
      description: >-
        A paginated feed of your own offers only, oldest-changed first, for
        reconciliation. Filter server-side with `status` (for example
        `accepted`) and `updatedSince`; there is no need to fetch everything
        and filter locally.


        Each row has exactly the shape returned by `getExternalHarvestOffer`,
        including the same accepted-only `seller` / `listing` enrichment and
        the same rules for the thumbnail (fresh per call, expires at
        `expiresAt`, optional, never an error). Rows that are not `accepted`
        carry `seller: null` and `listing: null`. Listing and image work is
        done once per distinct listing per page, however many offers refer to
        it.


        **This is not proof of delivery.** Mombongo does not track physical
        reception; you own that state.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetExternalHarvestOffersRequest'
      responses:
        '200':
          description: One page of offers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetExternalHarvestOffersResponse'
        '400':
          description: '`status` is not one of pending/accepted/declined, or `updatedSince` / `cursor` is malformed.'
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ErrorPlainText'
        '401':
          $ref: '#/components/responses/InvalidSignature'
        '405':
          description: Method not allowed — this endpoint only accepts POST.

webhooks:
  paymentComplete:
    post:
      operationId: paymentComplete
      summary: Sent when an invoice reaches a final state (paid or failed)
      description: >-
        Fires once, on the transition to "paid" or "failed" — not on every
        write to the invoice. Unchanged since Sprint AI; fires the same way
        regardless of invoice origin.

        This, offer_status_changed, and invoiceIssued below all land on
        the same webhookUrl — check the `event` field first to route the
        payload.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event, externalInvoiceId, status, amountUsd, paidAt]
              properties:
                event:
                  type: string
                  enum: [payment_complete]
                externalInvoiceId:
                  type: string
                  description: >-
                    Your own externalInvoiceId for a partner-originated
                    invoice. For a harvest-sale invoice, this is Mombongo's
                    invoiceId instead — there is no partner-originated id
                    for one of those (see notes on invoiceIssued below).
                status:
                  type: string
                  enum: [paid, failed]
                amountUsd:
                  type: number
                paidAt:
                  type: string
                  format: date-time
      responses:
        '200':
          description: Any 2xx response is treated as delivered. Non-2xx triggers a retry.

  offer_status_changed:
    post:
      operationId: offerStatusChanged
      summary: >-
        Authoritative accepted/declined signal for an offer you submitted
        (New — contract v2, 2026-09)
      description: >-
        Before this existed, harvest_offers status (pending/accepted/
        declined) was never communicated to you at all — the only signal
        you had that your offer won was invoiceIssued below, and a losing
        offer produced nothing, ever, by design. This closes that gap.

        Fires once the farmer selects a winner: you get exactly one event
        for your own offer — `status: "accepted"` if you won,
        `status: "declined"` if someone else did. If two different
        partners both had offers on the same listing, each is notified
        only about its own offer — a losing partner never learns who won,
        only that it lost. Always fires *after* the winning-offer
        transaction has committed, never from inside it, so you never
        receive this more than once for the same actual state change.

        For the winning offer, invoiceIssued below fires as a separate,
        immediately-following event — expect both, in that order, not one
        or the other.

        Lands on the same webhookUrl as paymentComplete and invoiceIssued
        — check the `event` field first to route the payload.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event, eventId, schemaVersion, occurredAt, partnerId, offerId, listingId, status, quantityKg, unitPriceCdf, currency]
              properties:
                event:
                  type: string
                  enum: [offer_status_changed]
                eventId:
                  type: string
                  description: >-
                    Deterministic — derived from (offerId, status), not
                    random. A retry (automatic backoff, or a manual admin
                    retry on our side) reuses the identical eventId, so you
                    can dedupe deliveries on it safely.
                schemaVersion:
                  type: integer
                  enum: [1]
                occurredAt:
                  type: string
                  format: date-time
                partnerId:
                  type: string
                offerId:
                  type: string
                externalReference:
                  type: [string, 'null']
                  description: Echoes the externalReference you sent when submitting the offer, if any.
                listingId:
                  type: string
                status:
                  type: string
                  enum: [accepted, declined]
                quantityKg:
                  type: number
                  description: Your own offerQuantityKg, echoed back.
                unitPriceCdf:
                  type: number
                  description: Your own offerPricePerKgCdf, echoed back.
                currency:
                  type: string
                  enum: [CDF]
      responses:
        '200':
          description: Any 2xx response is treated as delivered. Non-2xx triggers a retry.

  invoiceIssued:
    post:
      operationId: invoiceIssued
      summary: >-
        Sent when a farmer selects your offer, creating a new invoice
        (schemaVersion 2, 2026-09 — additive, all v1 fields unchanged)
      description: >-
        This is the first thing you learn about the invoice itself for a
        harvest-sale offer you won — there is no createExternalInvoice
        call for these, since Mombongo (not you) originates them. Pay the
        invoice the normal way via createExternalInvoiceCheckout once
        you've decided to.

        Fires immediately after offer_status_changed above (status:
        "accepted") for the same offer — expect both.

        **Receiving this event is not permission to pay.** It represents
        an expected payable purchase pending your own physical reception
        and quality/quantity approval of the delivery — Mombongo does not
        currently enforce a "wait for reception" boundary server-side;
        createExternalInvoiceCheckout will accept a checkout call
        immediately after this event fires. Treat that as a documented
        gap in your own integration's process, not a signal that paying
        immediately is expected or safe.

        Lands on the same webhookUrl as paymentComplete and
        offer_status_changed above — check the `event` field first to
        route the payload.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event, invoiceId, farmerId, amountUsd, quantityKg, commodity]
              properties:
                event:
                  type: string
                  enum: [invoice_issued]
                eventId:
                  type: string
                  description: >-
                    New in schemaVersion 2 — deterministic, derived from
                    invoiceId. Safe to dedupe deliveries on.
                schemaVersion:
                  type: integer
                  enum: [1, 2]
                  description: >-
                    v1 payloads (no eventId/offerId/externalReference/
                    unitPriceCdf/totalAmountCdf/currency) may still arrive
                    from in-flight retries of an event queued before this
                    upgrade; treat a missing schemaVersion as 1.
                occurredAt:
                  type: string
                  format: date-time
                  description: New in schemaVersion 2.
                invoiceId:
                  type: string
                  description: >-
                    Mombongo's own external_invoices document id — pass
                    this directly as invoiceId to createExternalInvoiceCheckout.
                    There is no separate externalInvoiceId field for a
                    harvest-sale invoice; this value fills that role too.
                offerId:
                  type: [string, 'null']
                  description: >-
                    New in schemaVersion 2. The specific offer that won —
                    listingId alone can't disambiguate which of your
                    (possibly multiple) offers on the same listing this
                    invoice came from. null only for an admin-assisted
                    invoice, where no offer exists.
                externalReference:
                  type: [string, 'null']
                  description: New in schemaVersion 2. Echoes the winning offer's externalReference, if any.
                farmerId:
                  type: string
                  description: The farmer's Mombongo user id.
                listingId:
                  type: [string, 'null']
                amountUsd:
                  type: number
                  description: >-
                    Your offerQuantityKg × offerPricePerKgCdf, converted to
                    USD at the exchange rate live at the moment the farmer
                    selected your offer — not necessarily the rate in effect
                    when you submitted the offer. Kept for backward
                    compatibility; prefer unitPriceCdf/totalAmountCdf
                    (CDF, not exchange-rate-dependent) for reconciliation.
                quantityKg:
                  type: number
                  description: The winning offer's quantity — your own offerQuantityKg echoed back.
                unitPriceCdf:
                  type: number
                  description: New in schemaVersion 2. Your own offerPricePerKgCdf, echoed back.
                totalAmountCdf:
                  type: number
                  description: New in schemaVersion 2. quantityKg × unitPriceCdf.
                currency:
                  type: string
                  enum: [CDF]
                  description: New in schemaVersion 2.
                commodity:
                  type: string
      responses:
        '200':
          description: Any 2xx response is treated as delivered. Non-2xx triggers a retry.
